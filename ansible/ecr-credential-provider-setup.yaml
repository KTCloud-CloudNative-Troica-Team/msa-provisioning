# kubelet ECR credential provider 설정 — SPEC §11.4 / Phase 0.
#
# 이 playbook은 다음을 수행:
# 1. cloud-provider-aws의 ecr-credential-provider 바이너리 다운로드 → /usr/local/bin/
# 2. /etc/kubernetes/credential-provider-config.yaml 배포
# 3. kubelet 시작 옵션 drop-in 추가:
#      --image-credential-provider-config=/etc/kubernetes/credential-provider-config.yaml
#      --image-credential-provider-bin-dir=/usr/local/bin
# 4. kubelet 재시작
#
# 사전조건:
# - terraform apply로 node 인스턴스 profile에 AmazonEC2ContainerRegistryReadOnly attach됨
#   (terraform/iam.tf의 node_ecr_readonly)
# - aws_account_id, aws_region 변수 정의됨 (inventory.ini 또는 ansible-playbook -e ...)
#
# **주의**: kubelet 재시작은 노드별 image pull/Pod 상태에 잠시 영향. 운영 클러스터라면
# rolling 적용 (한 노드씩) 권장 — `serial: 1`로 변경 가능.

- name: ECR credential provider 설정
  hosts: all
  become: true
  vars:
    # cloud-provider-aws 릴리스 — 본 PoC는 v1.30.x 라인 (모노레포 README의 클러스터 v1.30.14와 일치)
    ecr_credential_provider_version: v1.30.5
    ecr_credential_provider_url: "https://github.com/kubernetes/cloud-provider-aws/releases/download/{{ ecr_credential_provider_version }}/ecr-credential-provider-linux-amd64"
    ecr_credential_provider_bin: /usr/local/bin/ecr-credential-provider
    credential_provider_config: /etc/kubernetes/credential-provider-config.yaml
  tasks:
    - name: ecr-credential-provider 바이너리 다운로드
      ansible.builtin.get_url:
        url: "{{ ecr_credential_provider_url }}"
        dest: "{{ ecr_credential_provider_bin }}"
        mode: "0755"
        force: false               # 이미 있으면 skip — 버전 업그레이드 시 force: true 또는 별도 task

    - name: /etc/kubernetes 디렉토리 보장
      ansible.builtin.file:
        path: /etc/kubernetes
        state: directory
        mode: "0755"

    - name: credential-provider-config.yaml 배포
      ansible.builtin.template:
        src: configuration/credential-provider-config.yaml.j2
        dest: "{{ credential_provider_config }}"
        mode: "0644"
      register: cred_provider_config

    - name: kubelet systemd drop-in 디렉토리 보장
      ansible.builtin.file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        mode: "0755"

    - name: kubelet 시작 옵션 drop-in 작성
      ansible.builtin.copy:
        dest: /etc/systemd/system/kubelet.service.d/30-ecr-credential-provider.conf
        mode: "0644"
        content: |
          [Service]
          Environment="KUBELET_EXTRA_ARGS=--image-credential-provider-config={{ credential_provider_config }} --image-credential-provider-bin-dir=/usr/local/bin"
      register: kubelet_dropin

    - name: systemd daemon-reload (kubelet config 변경 반영)
      ansible.builtin.systemd:
        daemon_reload: true
      when: kubelet_dropin.changed or cred_provider_config.changed

    - name: kubelet 재시작 (image credential provider 활성화)
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
      when: kubelet_dropin.changed or cred_provider_config.changed
