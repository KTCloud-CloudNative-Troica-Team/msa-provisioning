# kubelet ECR credential provider setup - SPEC §11.4 / Phase 0.
#
# This playbook performs:
# 1. Copy the cloud-provider-aws ecr-credential-provider binary -> /usr/local/bin/
# 2. Deploy /etc/kubernetes/credential-provider-config.yaml
# 3. Add kubelet startup option drop-in:
#      --image-credential-provider-config=/etc/kubernetes/credential-provider-config.yaml
#      --image-credential-provider-bin-dir=/usr/local/bin
# 4. Restart kubelet
#
# Prerequisites:
# - AmazonEC2ContainerRegistryReadOnly attached to the node instance profile via
#   terraform apply (see terraform/iam.tf - node_ecr_readonly)
# - aws_account_id, aws_region variables defined (inventory.ini or ansible-playbook -e ...)
#
# **Note**: kubelet restart briefly affects image pull / Pod state on each node.
# For production clusters, rolling apply (one node at a time) is recommended -
# change to `serial: 1`.

- name: ECR credential provider setup
  hosts: all
  become: true
  vars:
    # cloud-provider-aws does not publish binary assets on GitHub releases (assets=0).
    # Option 1: build from Go source directly (this PoC)
    # Option 2: imagePullSecret + CronJob token refresh (simple but 12h token expiry)
    #
    # Build procedure (one-time, run before this playbook):
    #   sudo apt install -y golang-go
    #   git clone --depth 1 --branch v1.30.10 https://github.com/kubernetes/cloud-provider-aws.git /tmp/build/cloud-provider-aws
    #   cd /tmp/build/cloud-provider-aws
    #   CGO_ENABLED=0 go build -o /tmp/ecr-credential-provider ./cmd/ecr-credential-provider
    #
    # Verification: /tmp/ecr-credential-provider should exist as a ~30MB binary.
    ecr_credential_provider_local_src: /tmp/ecr-credential-provider
    ecr_credential_provider_bin: /usr/local/bin/ecr-credential-provider
    credential_provider_config: /etc/kubernetes/credential-provider-config.yaml
  tasks:
    - name: Check locally built ecr-credential-provider binary exists
      ansible.builtin.stat:
        path: "{{ ecr_credential_provider_local_src }}"
      register: local_binary
      delegate_to: localhost
      become: false

    - name: Fail with build instructions if local binary missing
      ansible.builtin.fail:
        msg: |
          {{ ecr_credential_provider_local_src }} not found.
          See the vars comment in this playbook to build cloud-provider-aws first.
      when: not local_binary.stat.exists

    - name: Copy ecr-credential-provider binary to node
      ansible.builtin.copy:
        src: "{{ ecr_credential_provider_local_src }}"
        dest: "{{ ecr_credential_provider_bin }}"
        mode: "0755"

    - name: Ensure /etc/kubernetes directory exists
      ansible.builtin.file:
        path: /etc/kubernetes
        state: directory
        mode: "0755"

    - name: Deploy credential-provider-config.yaml
      ansible.builtin.template:
        src: configuration/credential-provider-config.yaml.j2
        dest: "{{ credential_provider_config }}"
        mode: "0644"
      register: cred_provider_config

    - name: Ensure kubelet systemd drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        mode: "0755"

    - name: Write kubelet startup option drop-in (first attempt - some envs systemd evaluates it)
      ansible.builtin.copy:
        dest: /etc/systemd/system/kubelet.service.d/30-ecr-credential-provider.conf
        mode: "0644"
        content: |
          [Service]
          Environment="KUBELET_EXTRA_ARGS=--image-credential-provider-config={{ credential_provider_config }} --image-credential-provider-bin-dir=/usr/local/bin"
      register: kubelet_dropin

    # In our cluster (Amazon Linux 2023 + kubeadm 1.30), the KUBELET_EXTRA_ARGS in
    # the drop-in above is not evaluated by systemd (not present in actual kubelet args
    # via ps aux). So we integrate the ECR args directly into KUBELET_KUBEADM_ARGS in
    # kubeadm-flags.env as a fallback.
    # The hardcoded args (container-runtime-endpoint, pod-infra-container-image) match
    # our cluster's containerd + pause:3.9 setup. Other clusters may need adjustment.
    - name: Integrate ECR credential provider args directly into kubeadm-flags.env (fallback)
      ansible.builtin.lineinfile:
        path: /var/lib/kubelet/kubeadm-flags.env
        regexp: '^KUBELET_KUBEADM_ARGS='
        line: 'KUBELET_KUBEADM_ARGS="--image-credential-provider-config={{ credential_provider_config }} --image-credential-provider-bin-dir=/usr/local/bin --container-runtime-endpoint=unix:///var/run/containerd/containerd.sock --pod-infra-container-image=registry.k8s.io/pause:3.9"'
      register: kubeadm_flags

    - name: systemd daemon-reload (apply kubelet config changes)
      ansible.builtin.systemd:
        daemon_reload: true
      when: kubelet_dropin.changed or cred_provider_config.changed or kubeadm_flags.changed

    - name: Restart kubelet (activate image credential provider)
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
      when: kubelet_dropin.changed or cred_provider_config.changed or kubeadm_flags.changed

    - name: Verify ECR provider args actually applied to kubelet
      ansible.builtin.shell:
        cmd: ps -ef | grep '[k]ubelet' | grep -q image-credential-provider-config
      register: kubelet_verify
      changed_when: false
      failed_when: kubelet_verify.rc != 0
