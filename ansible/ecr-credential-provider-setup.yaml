# kubelet ECR credential provider 설정 — SPEC §11.4 / Phase 0.
#
# 이 playbook은 다음을 수행:
# 1. cloud-provider-aws의 ecr-credential-provider 바이너리 다운로드 → /usr/local/bin/
# 2. /etc/kubernetes/credential-provider-config.yaml 배포
# 3. kubelet 시작 옵션 drop-in 추가:
#      --image-credential-provider-config=/etc/kubernetes/credential-provider-config.yaml
#      --image-credential-provider-bin-dir=/usr/local/bin
# 4. kubelet 재시작
#
# 사전조건:
# - terraform apply로 node 인스턴스 profile에 AmazonEC2ContainerRegistryReadOnly attach됨
#   (terraform/iam.tf의 node_ecr_readonly)
# - aws_account_id, aws_region 변수 정의됨 (inventory.ini 또는 ansible-playbook -e ...)
#
# **주의**: kubelet 재시작은 노드별 image pull/Pod 상태에 잠시 영향. 운영 클러스터라면
# rolling 적용 (한 노드씩) 권장 — `serial: 1`로 변경 가능.

- name: ECR credential provider 설정
  hosts: all
  become: true
  vars:
    # cloud-provider-aws는 GitHub release에 binary 자산을 게시하지 않음 (assets=0).
    # 대안 1: Go 소스에서 직접 빌드 (본 PoC)
    # 대안 2: imagePullSecret + CronJob token refresh (간단하나 12시간 token 만료)
    #
    # 빌드 절차 (1회, 본 playbook 실행 전 사전 수행):
    #   sudo apt install -y golang-go
    #   git clone --depth 1 --branch v1.30.10 https://github.com/kubernetes/cloud-provider-aws.git /tmp/build/cloud-provider-aws
    #   cd /tmp/build/cloud-provider-aws
    #   CGO_ENABLED=0 go build -o /tmp/ecr-credential-provider ./cmd/ecr-credential-provider
    #
    # 검증: /tmp/ecr-credential-provider 가 ~30MB binary로 존재해야 함.
    ecr_credential_provider_local_src: /tmp/ecr-credential-provider
    ecr_credential_provider_bin: /usr/local/bin/ecr-credential-provider
    credential_provider_config: /etc/kubernetes/credential-provider-config.yaml
  tasks:
    - name: ecr-credential-provider 로컬 빌드 binary 존재 확인
      ansible.builtin.stat:
        path: "{{ ecr_credential_provider_local_src }}"
      register: local_binary
      delegate_to: localhost
      become: false

    - name: 로컬 binary 없으면 빌드 안내 후 fail
      ansible.builtin.fail:
        msg: |
          {{ ecr_credential_provider_local_src }} 가 없습니다.
          본 playbook의 vars 주석을 참조해서 cloud-provider-aws를 먼저 빌드하세요.
      when: not local_binary.stat.exists

    - name: ecr-credential-provider 바이너리를 노드로 복사
      ansible.builtin.copy:
        src: "{{ ecr_credential_provider_local_src }}"
        dest: "{{ ecr_credential_provider_bin }}"
        mode: "0755"

    - name: /etc/kubernetes 디렉토리 보장
      ansible.builtin.file:
        path: /etc/kubernetes
        state: directory
        mode: "0755"

    - name: credential-provider-config.yaml 배포
      ansible.builtin.template:
        src: configuration/credential-provider-config.yaml.j2
        dest: "{{ credential_provider_config }}"
        mode: "0644"
      register: cred_provider_config

    - name: kubelet systemd drop-in 디렉토리 보장
      ansible.builtin.file:
        path: /etc/systemd/system/kubelet.service.d
        state: directory
        mode: "0755"

    - name: kubelet 시작 옵션 drop-in 작성 (1차 시도 — 일부 환경에서 systemd가 평가)
      ansible.builtin.copy:
        dest: /etc/systemd/system/kubelet.service.d/30-ecr-credential-provider.conf
        mode: "0644"
        content: |
          [Service]
          Environment="KUBELET_EXTRA_ARGS=--image-credential-provider-config={{ credential_provider_config }} --image-credential-provider-bin-dir=/usr/local/bin"
      register: kubelet_dropin

    # 우리 클러스터(Amazon Linux 2023 + kubeadm 1.30)에서는 위 drop-in의 KUBELET_EXTRA_ARGS가
    # systemd에 의해 평가되지 않는 문제가 관찰됨 (ps aux로 kubelet 실제 args에 안 들어감).
    # 그래서 kubeadm-flags.env의 KUBELET_KUBEADM_ARGS에 직접 ECR args를 통합.
    # hardcoded args (container-runtime-endpoint, pod-infra-container-image)는 우리 클러스터의
    # containerd + pause:3.9 setup 기준. 다른 클러스터에서는 수정 필요.
    - name: kubeadm-flags.env에 ECR credential provider args 직접 통합 (fallback)
      ansible.builtin.lineinfile:
        path: /var/lib/kubelet/kubeadm-flags.env
        regexp: '^KUBELET_KUBEADM_ARGS='
        line: 'KUBELET_KUBEADM_ARGS="--image-credential-provider-config={{ credential_provider_config }} --image-credential-provider-bin-dir=/usr/local/bin --container-runtime-endpoint=unix:///var/run/containerd/containerd.sock --pod-infra-container-image=registry.k8s.io/pause:3.9"'
      register: kubeadm_flags

    - name: systemd daemon-reload (kubelet config 변경 반영)
      ansible.builtin.systemd:
        daemon_reload: true
      when: kubelet_dropin.changed or cred_provider_config.changed or kubeadm_flags.changed

    - name: kubelet 재시작 (image credential provider 활성화)
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
      when: kubelet_dropin.changed or cred_provider_config.changed or kubeadm_flags.changed

    - name: kubelet args에 ECR provider 인자 실제 반영 확인
      ansible.builtin.shell:
        cmd: ps -ef | grep '[k]ubelet' | grep -q image-credential-provider-config
      register: kubelet_verify
      changed_when: false
      failed_when: kubelet_verify.rc != 0
