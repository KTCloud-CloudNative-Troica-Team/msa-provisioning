- name: Kubernetes cluster prerequisites
  hosts: all
  become: true
  tasks:
    - name: Disable swap
      ansible.builtin.command: swapoff -a
      when: ansible_swaptotal_mb > 0

    - name: Load kernel modules
      modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Apply bridge network sysctl setting
      ansible.builtin.sysctl:
        name: net.bridge.bridge-nf-call-iptables
        value: "1"
        state: present

    - name: Add master node entries to /etc/hosts
      lineinfile:
        path: /etc/hosts
        line: "{{ item.ip }} {{ item.name }}"
      loop:
        - { ip: "{{ a_master_01_private_ip }}", name: "a-master-01" }
        - { ip: "{{ a_master_02_private_ip }}", name: "a-master-02" }
        - { ip: "{{ b_master_01_private_ip }}", name: "b-master-01" }
