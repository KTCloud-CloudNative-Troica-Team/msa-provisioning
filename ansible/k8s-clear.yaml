- name: Kubernetes 클러스터 정리
  hosts: all
  become: true
  tasks:
    - name: kubeadm reset 명령 실행
      ansible.builtin.shell: |
        kubeadm reset -f --cri-socket unix:///var/run/containerd/containerd.sock
      register: reset_result
      changed_when: true

    - name: Kubernetes 관련 디렉터리 및 파일 삭제
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes/
        - /var/lib/etcd/
        - /var/lib/kubelet/
        - /etc/cni/net.d/
        - /var/lib/cni/

    - name: kubeconfig 파일 삭제
      ansible.builtin.file:
        path: /home/ec2-user/.kube/
        state: absent

    - name: 네트워크 인터페이스 정리
      ansible.builtin.shell: |
        ip link delete cni0 || true
        ip link delete flannel.1 || true
        ip link delete cali || true
      changed_when: true
      ignore_errors: true

    - name: containerd 서비스 재시작
      ansible.builtin.systemd:
        name: containerd
        state: restarted
