- name: Kubernetes cluster cleanup
  hosts: all
  become: true
  tasks:
    - name: Run kubeadm reset
      ansible.builtin.shell: |
        kubeadm reset -f --cri-socket unix:///var/run/containerd/containerd.sock
      register: reset_result
      changed_when: true

    - name: Remove Kubernetes-related directories and files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/kubernetes/
        - /var/lib/etcd/
        - /var/lib/kubelet/
        - /etc/cni/net.d/
        - /var/lib/cni/

    - name: Remove kubeconfig file
      ansible.builtin.file:
        path: /home/ec2-user/.kube/
        state: absent

    - name: Cleanup network interfaces
      ansible.builtin.shell: |
        ip link delete cni0 || true
        ip link delete flannel.1 || true
        ip link delete cali || true
      changed_when: true
      ignore_errors: true

    - name: Restart containerd service
      ansible.builtin.systemd:
        name: containerd
        state: restarted
