# AWS Load Balancer Controller (LBC) removed: Troica creates external NLB directly
# via terraform, and in-cluster ingress is handled by Istio Gateway. We don't use
# K8s `kind: Ingress` resources or Service `type: LoadBalancer` auto-conversion,
# so LBC itself is unnecessary.
# Side effect: LBC's mutating webhook (mservice.elbv2.k8s.aws) intercepts all
# Service resource creation, causing webhook timeout right after ArgoCD's Service
# creation (LBC pod not yet Ready) -> helm install fails. Removing LBC itself is
# the cleanest fix.
# - import_playbook: nlb-setup.yaml

- import_playbook: argocd-setup.yaml

# Phase 0 - configure kubelet credential provider so kubelet can pull images
# from ECR private repos. Applied after the whole cluster is ready (kubelet
# restart happens per-node).
- import_playbook: ecr-credential-provider-setup.yaml
