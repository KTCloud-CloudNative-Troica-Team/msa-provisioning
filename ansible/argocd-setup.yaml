- name: ArgoCD 셋업
  hosts: main-master
  become: false
  tasks:
    - name: ArgoCD용 Namespace 생성
      kubernetes.core.k8s:
        name: "argocd"
        kind: Namespace
        state: present
        kubeconfig: /home/ec2-user/.kube/config

    - name: ArgoCD Helm 리포지토리 추가
      kubernetes.core.helm_repository:
        name: argo
        repo_url: "https://argoproj.github.io/argo-helm"

    - name: Helm 리포지토리 업데이트
      command: helm repo update

    # LBC webhook delete workaround 제거: main.yaml 에서 nlb-setup.yaml 자체를 제거했으므로
    # mservice.elbv2.k8s.aws / vservice.elbv2.k8s.aws webhook 가 처음부터 등록 안 됨.

    - name: ArgoCD 설치
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        release_namespace: "argocd"
        create_namespace: true
        wait: true
        values:
          server:
            service:
              type: NodePort
              # 30080 = Istio Gateway 가 사용 (platform/11-istio-cp/application.yaml 의
              # http2 ports[1].nodePort). 외부 NLB 표준 진입점이라 양보 X.
              # ArgoCD UI 는 운영 진입이라 별 port (30090).
              nodePorts:
                http: 30090
            extraArgs:
              - --insecure

    - name: CRD 존재 확인
      kubernetes.core.k8s_info:
        kind: CustomResourceDefinition
        name: applications.argoproj.io
      register: crd_info
      until: crd_info.resources | length > 0
      retries: 10
      delay: 5

    # R-32: 팀장님 개인 레포(kanei0415/ktcloud-k8s-argocd-manifest)에서
    # 우리 팀 매니페스트 레포(KTCloud-CloudNative-Troica-Team/msa-argocd-manifest)로 전환.
    # inline yaml 정의 대신 매니페스트 레포의 bootstrap/root-app.yaml을 fetch + apply →
    # 단일 진실의 원천 유지 (root-app spec 변경 시 ansible 재실행 불필요, ArgoCD가 자동 sync).
    - name: 매니페스트 레포의 root-app.yaml 다운로드
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/KTCloud-CloudNative-Troica-Team/msa-argocd-manifest/main/bootstrap/root-app.yaml
        dest: /tmp/root-app.yaml
        mode: "0644"

    - name: ArgoCD root Application 생성 (app-of-apps 진입점)
      kubernetes.core.k8s:
        state: present
        src: /tmp/root-app.yaml
        kubeconfig: /home/ec2-user/.kube/config
