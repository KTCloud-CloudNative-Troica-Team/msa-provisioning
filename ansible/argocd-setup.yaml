- name: ArgoCD 셋업
  hosts: main-master
  become: false
  tasks:
    - name: ArgoCD용 Namespace 생성
      kubernetes.core.k8s:
        name: "argocd"
        kind: Namespace
        state: present
        kubeconfig: /home/ec2-user/.kube/config

    - name: ArgoCD Helm 리포지토리 추가
      kubernetes.core.helm_repository:
        name: argo
        repo_url: "https://argoproj.github.io/argo-helm"

    - name: Helm 리포지토리 업데이트
      command: helm repo update

    # LBC webhook delete workaround 제거: main.yaml 에서 nlb-setup.yaml 자체를 제거했으므로
    # mservice.elbv2.k8s.aws / vservice.elbv2.k8s.aws webhook 가 처음부터 등록 안 됨.

    - name: ArgoCD 설치
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        release_namespace: "argocd"
        create_namespace: true
        wait: true
        values:
          server:
            service:
              type: NodePort
              # 외부 NLB 표준 진입점 = Istio Gateway (30080 http + 30443 https).
              # ArgoCD chart 의 default nodePort 가 같은 30080/30443 → 충돌 (ArgoCD 가
              # 먼저 sync → port 점유 → Istio Gateway Service Invalid → ingressgateway 안 뜸).
              # ArgoCD UI 는 운영 진입 (--insecure 모드라 https 사실상 안 씀) → 두 port 양보.
              #
              # IMPORTANT — chart 의 정확한 path:
              #   argo-cd chart 9.5.14 의 server.service 의 nodePort key 는 명백히 single
              #   camelCase: `nodePortHttp` / `nodePortHttps`. 이전 commit (PR #19/#20) 의
              #   `nodePorts.http / nodePorts.https` (nested) 는 chart template 가 reference
              #   안 함 → helm 가 받았어도 무시 → chart default (30080/30443) 그대로 적용.
              #
              # 검증: helm show values argo/argo-cd | grep -B 1 nodePortHttp
              #   # -- Server service http port for NodePort service type
              #   nodePortHttp: 30080
              #   nodePortHttps: 30443
              nodePortHttp: 30090
              nodePortHttps: 30493
            extraArgs:
              - --insecure

    - name: CRD 존재 확인
      kubernetes.core.k8s_info:
        kind: CustomResourceDefinition
        name: applications.argoproj.io
      register: crd_info
      until: crd_info.resources | length > 0
      retries: 10
      delay: 5

    # R-32: 팀장님 개인 레포(kanei0415/ktcloud-k8s-argocd-manifest)에서
    # 우리 팀 매니페스트 레포(KTCloud-CloudNative-Troica-Team/msa-argocd-manifest)로 전환.
    # inline yaml 정의 대신 매니페스트 레포의 bootstrap/root-app.yaml을 fetch + apply →
    # 단일 진실의 원천 유지 (root-app spec 변경 시 ansible 재실행 불필요, ArgoCD가 자동 sync).
    - name: 매니페스트 레포의 root-app.yaml 다운로드
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/KTCloud-CloudNative-Troica-Team/msa-argocd-manifest/main/bootstrap/root-app.yaml
        dest: /tmp/root-app.yaml
        mode: "0644"

    - name: ArgoCD root Application 생성 (app-of-apps 진입점)
      kubernetes.core.k8s:
        state: present
        src: /tmp/root-app.yaml
        kubeconfig: /home/ec2-user/.kube/config
