- name: ArgoCD setup
  hosts: main-master
  become: false
  tasks:
    - name: Create namespace for ArgoCD
      kubernetes.core.k8s:
        name: "argocd"
        kind: Namespace
        state: present
        kubeconfig: /home/ec2-user/.kube/config

    - name: Add ArgoCD Helm repository
      kubernetes.core.helm_repository:
        name: argo
        repo_url: "https://argoproj.github.io/argo-helm"

    - name: Update Helm repositories
      command: helm repo update

    # LBC webhook delete workaround removed: nlb-setup.yaml has been dropped
    # from main.yaml entirely, so mservice.elbv2.k8s.aws / vservice.elbv2.k8s.aws
    # webhooks are never registered.

    - name: Install ArgoCD
      kubernetes.core.helm:
        name: argocd
        chart_ref: argo/argo-cd
        release_namespace: "argocd"
        create_namespace: true
        wait: true
        values:
          server:
            service:
              type: NodePort
              # External NLB standard entrypoint = Istio Gateway (30080 http + 30443 https).
              # ArgoCD chart's default nodePort is the same 30080/30443 -> collision (ArgoCD
              # syncs first -> port occupied -> Istio Gateway Service Invalid -> ingressgateway
              # cannot come up). ArgoCD UI is for operator use (--insecure mode so https is
              # practically unused) -> yield both ports.
              #
              # IMPORTANT - chart's exact path:
              #   argo-cd chart 9.5.14's server.service.nodePort key is explicitly single
              #   camelCase: `nodePortHttp` / `nodePortHttps`. Earlier commits (PR #19/#20)
              #   `nodePorts.http / nodePorts.https` (nested) was not referenced by the chart
              #   template -> helm accepted it but ignored it -> chart defaults (30080/30443)
              #   were applied as-is.
              #
              # Verification: helm show values argo/argo-cd | grep -B 1 nodePortHttp
              #   # -- Server service http port for NodePort service type
              #   nodePortHttp: 30080
              #   nodePortHttps: 30443
              nodePortHttp: 30090
              nodePortHttps: 30493
            extraArgs:
              - --insecure

    - name: Verify CRD existence
      kubernetes.core.k8s_info:
        kind: CustomResourceDefinition
        name: applications.argoproj.io
      register: crd_info
      until: crd_info.resources | length > 0
      retries: 10
      delay: 5

    # R-32: Switched from the team lead's personal repo (kanei0415/ktcloud-k8s-argocd-manifest)
    # to our team manifest repo (KTCloud-CloudNative-Troica-Team/msa-argocd-manifest).
    # Instead of inline yaml definition, we fetch + apply the manifest repo's
    # bootstrap/root-app.yaml -> single source of truth maintained (no ansible
    # re-run needed on root-app spec changes; ArgoCD auto-syncs).
    - name: Download root-app.yaml from manifest repo
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/KTCloud-CloudNative-Troica-Team/msa-argocd-manifest/main/bootstrap/root-app.yaml
        dest: /tmp/root-app.yaml
        mode: "0644"

    - name: Create ArgoCD root Application (app-of-apps entrypoint)
      kubernetes.core.k8s:
        state: present
        src: /tmp/root-app.yaml
        kubeconfig: /home/ec2-user/.kube/config
